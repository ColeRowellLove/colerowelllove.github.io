<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Open Graph card</title>
    <style>
      @font-face {
        font-family: 'JetBrains Mono';
        font-weight: 400;
        src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-weight: 700;
        src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-700-normal.woff2')
          format('woff2');
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
      }
      body {
        position: relative;
        overflow: hidden;
        color: #e6edf3;
        font-family: 'JetBrains Mono', monospace;
        background-color: #0d1117;
        background-image:
          linear-gradient(rgba(48, 54, 61, 0.35) 1px, transparent 1px),
          linear-gradient(90deg, rgba(48, 54, 61, 0.35) 1px, transparent 1px);
        background-size: 40px 40px;
      }
      .dots {
        position: absolute;
        top: 64px;
        left: 80px;
        display: flex;
        gap: 10px;
      }
      .dots span {
        width: 16px;
        height: 16px;
        border-radius: 50%;
      }
      .dots span:nth-child(1) {
        background: #ff5f56;
      }
      .dots span:nth-child(2) {
        background: #ffbd2e;
      }
      .dots span:nth-child(3) {
        background: #27c93f;
      }
      .text {
        position: absolute;
        left: 80px;
        top: 150px;
        width: 640px;
      }
      .prompt {
        font-size: 28px;
        color: #9aa4b2;
      }
      .prompt b {
        color: #7ee787;
        font-weight: 400;
      }
      h1 {
        margin: 28px 0 0;
        font-size: 64px;
        font-weight: 700;
        line-height: 1.05;
        white-space: nowrap;
        letter-spacing: -0.03em;
      }
      h1::after {
        content: '';
        display: inline-block;
        width: 0.5em;
        height: 0.09em;
        margin-left: 0.15em;
        background: #7ee787;
      }
      .tagline {
        margin-top: 32px;
        font-size: 26px;
        line-height: 1.4;
        color: #9aa4b2;
        white-space: nowrap;
      }
      .url {
        position: absolute;
        left: 80px;
        bottom: 56px;
        font-size: 26px;
        color: #79c0ff;
      }
      .photo {
        position: absolute;
        right: 80px;
        top: 135px;
        width: 360px;
        height: 360px;
        object-fit: cover;
        border: 2px solid #30363d;
        border-radius: 28px;
      }
    </style>
  </head>
  <body>
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="text">
      <div class="prompt">~/cole <b>$</b> whoami</div>
      <h1>Cole Rowell-Love</h1>
      <div class="tagline">Machine learning and data engineering</div>
    </div>
    <img class="photo" src="../src/assets/cole.jpg" alt="" />
    <div class="url">colerowelllove.github.io</div>
  </body>
</html>
