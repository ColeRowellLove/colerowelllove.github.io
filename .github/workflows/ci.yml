name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint HTML, CSS and JS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Validate HTML
        run: npm run lint:html

      - name: Lint CSS
        run: npm run lint:css

      - name: Lint JavaScript
        run: npm run lint:js

  site-check:
    name: Check site files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the site
        run: npm run build

      - name: Required files exist
        run: |
          for f in index.html experience.html projects.html about.html contact.html 404.html favicon.svg robots.txt sitemap.xml; do
            test -f "dist/$f" || { echo "Missing dist/$f"; exit 1; }
          done
          test -f README.md || { echo "Missing README.md"; exit 1; }

      - name: Internal links and assets resolve
        run: |
          for page in dist/*.html; do
            for href in $(grep -oE '(href|src)="/[^"#?]*"' "$page" | sed -E 's/.*="([^"]*)"/\1/'); do
              case "$href" in
                /) f=dist/index.html ;;
                *.*) f="dist$href" ;;
                *) f="dist$href.html" ;;
              esac
              test -f "$f" || { echo "$page links to a missing target: $href"; exit 1; }
            done
          done

  a11y-perf:
    name: Accessibility and performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the site
        run: npm run build

      - name: Accessibility (axe, WCAG A and AA, dark and light)
        run: node scripts/a11y.mjs

      - name: Performance and best practices (Lighthouse CI)
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 14
