name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint HTML, CSS and JS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate HTML
        run: npm run lint:html

      - name: Lint CSS
        run: npm run lint:css

      - name: Lint JavaScript
        run: npm run lint:js

  site-check:
    name: Check site files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build the site
        run: npm run build

      - name: Required files exist
        run: |
          for f in index.html experience.html projects.html about.html contact.html 404.html favicon.svg robots.txt sitemap.xml; do
            test -f "dist/$f" || { echo "Missing dist/$f"; exit 1; }
          done
          test -f README.md || { echo "Missing README.md"; exit 1; }

      - name: Internal links and assets resolve
        run: |
          for page in dist/*.html; do
            for href in $(grep -oE '(href|src)="/[^"#?]*"' "$page" | sed -E 's/.*="([^"]*)"//'); do
              case "$href" in
                /) f=dist/index.html ;;
                *.*) f="dist$href" ;;
                *) f="dist$href.html" ;;
              esac
              test -f "$f" || { echo "$page links to a missing target: $href"; exit 1; }
            done
          done
